<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Solitaire n’ Chill</title>
  <meta name="description" content="A cosy, customisable Klondike solitaire. Play your own music, pick your background and card backs, and keep the time and weather nearby.">
  <meta name="theme-color" content="#1b2038">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231b2038'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='%23ffb86b'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/panels.css">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <div id="bg-grain" aria-hidden="true"></div>
  <div id="bg-dim" aria-hidden="true"></div>
  <canvas id="bg-fx" aria-hidden="true"></canvas>

  <div id="app">
    <header class="topbar">
      <div class="brand" aria-label="Solitaire n’ Chill">
        <span class="brand-ico" aria-hidden="true">♠</span>
        <span class="brand-name">solitaire <em>n’</em> chill</span>
      </div>

      <nav class="actions" aria-label="Game controls">
        <button id="btn-new" class="btn" aria-haspopup="menu"><span class="ico-l" aria-hidden="true">✦</span><span class="lbl">New</span><span class="caret" aria-hidden="true">▾</span></button>
        <button id="btn-undo" class="btn" title="Undo (U)"><span class="ico-l" aria-hidden="true">↶</span><span class="lbl">Undo</span></button>
        <button id="btn-hint" class="btn" title="Hint (H)"><span class="ico-l" aria-hidden="true">💡</span><span class="lbl">Hint</span></button>
        <button id="btn-finish" class="btn accent" title="Finish for me (F)" hidden><span class="ico-l" aria-hidden="true">✨</span><span class="lbl">Finish</span></button>
      </nav>

      <div id="mini-stats" class="mini-stats" aria-live="off"></div>

      <div class="tools">
        <button id="btn-widgets" class="btn" title="Widgets"><span class="ico-l" aria-hidden="true">🧩</span><span class="lbl">Widgets</span></button>
        <button id="btn-customize" class="btn" title="Customize"><span class="ico-l" aria-hidden="true">🎨</span><span class="lbl">Customize</span></button>
      </div>
    </header>

    <main class="stage">
      <aside id="rail-left" class="rail left" aria-label="Widgets (left)"></aside>
      <div class="board-wrap"><div id="board" class="board" role="application" aria-label="Solitaire table – drag cards, or tap a card to move it"></div></div>
      <aside id="rail-right" class="rail right" aria-label="Widgets (right)"></aside>
    </main>

    <footer class="dock">
      <div id="music" class="music"></div>
    </footer>
  </div>

  <aside id="drawer" class="drawer" aria-label="Widgets">
    <div class="drawer-head"><strong>Widgets</strong>
      <span><button id="drawer-arrange" class="btn small">Arrange</button> <button id="drawer-close" class="ico" aria-label="Close widgets">✕</button></span>
    </div>
    <div id="drawer-list" class="drawer-list"></div>
  </aside>
  <div id="tray" class="tray" hidden></div>
  <div id="modal-root"></div>
  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#1b2038;font:16px sans-serif">Solitaire n’ Chill needs JavaScript to deal the cards.</p></noscript>

  <script src="js/util.js"></script>
  <script src="js/klondike.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
  <script src="js/music.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/customize.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
